        // Target Date: Approx First Weekend of Feb 2027
        const GATE_DATE = new Date('2027-02-06T08:00:00+05:30').getTime();

        // --- INIT APP ---
        function init() {
            render(); // Render initial UI
            
            if (!supabase) {
                state.view = 'auth';
                state.authError = "SYSTEM HALTED: Supabase URL and Key missing. Check source code.";
                render();
            } else {
                state.view = 'auth';
                render();
            }

            // Start Countdown Timer
            setInterval(() => {
                const now = new Date().getTime();
                
                // Original Countdown
                const distance = GATE_DATE - now;
                if (distance >= 0) {
                    state.countdown = {
                        d: Math.floor(distance / (1000 * 60 * 60 * 24)),
                        h: Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)),
                        m: Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60)),
                        s: Math.floor((distance % (1000 * 60)) / 1000)
                    };
                } else {
                    state.countdown = { d: 0, h: 0, m: 0, s: 0 };
                }

                // Revised Countdown
                if (state.customTargetDate) {
                    const revDistance = state.customTargetDate - now;
                    if (revDistance >= 0) {
                        state.revisedCountdown = {
                            d: Math.floor(revDistance / (1000 * 60 * 60 * 24)),
                            h: Math.floor((revDistance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)),
                            m: Math.floor((revDistance % (1000 * 60 * 60)) / (1000 * 60)),
                            s: Math.floor((revDistance % (1000 * 60)) / 1000)
                        };
                    } else {
                        state.revisedCountdown = { d: 0, h: 0, m: 0, s: 0 };
                    }
                }

                updateCountdownDOM();

            }, 1000);

            // Set up Event Listeners
            setupEventListeners();
        }

        // --- GLOBAL NOTES LOADER ---
        async function loadGlobalNotes() {
            let globalNotesMap = {};

            // 1. Try Supabase Cloud Fetch
            if (supabase) {
                // 1A. Fetch from dedicated gate_notes table if available
                try {
                    const { data, error } = await supabase
                        .from('gate_notes')
                        .select('*');

                    if (!error && data && data.length > 0) {
                        data.forEach(item => {
                            if (!globalNotesMap[item.subject_id]) {
                                globalNotesMap[item.subject_id] = [];
                            }
                            globalNotesMap[item.subject_id].push({
                                id: item.id,
                                title: item.title,
                                description: item.description,
                                fileUrl: item.file_url,
                                uploadedAt: item.uploaded_at,
                                size: item.size || 'PDF'
                            });
                        });
                    }
                } catch (e) {
                    console.log("Supabase gate_notes fetch fallback:", e);
                }

                // 1B. Fetch directly from Admin_Operator's account in gate_accounts (Works across all devices!)
                try {
                    const { data: adminAcc, error: adminErr } = await supabase
                        .from('gate_accounts')
                        .select('subjects')
                        .ilike('username', ADMIN_USERNAME)
                        .maybeSingle();

                    if (!adminErr && adminAcc && adminAcc.subjects) {
                        adminAcc.subjects.forEach(sub => {
                            if (sub.notes && sub.notes.length > 0) {
                                if (!globalNotesMap[sub.id]) {
                                    globalNotesMap[sub.id] = [];
                                }
                                const existingIds = new Set(globalNotesMap[sub.id].map(n => n.id));
                                sub.notes.forEach(note => {
                                    if (!existingIds.has(note.id)) {
                                        globalNotesMap[sub.id].push(note);
                                        existingIds.add(note.id);
                                    }
                                });
                            }
                        });
                    }
                } catch (e) {
                    console.log("Supabase Admin account notes fetch fallback:", e);
                }
            }

            // 2. Merge local storage backup notes
            try {
                const localSavedNotes = localStorage.getItem('gate_global_notes');
                if (localSavedNotes) {
                    const parsed = JSON.parse(localSavedNotes);
                    Object.keys(parsed).forEach(subId => {
                        if (!globalNotesMap[subId]) {
                            globalNotesMap[subId] = parsed[subId] || [];
                        } else {
                            // Merge without duplicates
                            const existingIds = new Set(globalNotesMap[subId].map(n => n.id));
                            (parsed[subId] || []).forEach(note => {
                                if (!existingIds.has(note.id)) {
                                    globalNotesMap[subId].push(note);
                                }
                            });
                        }
                    });
                }
            } catch (e) {
                console.error("Local notes parse error:", e);
            }

            // Attach notes map to subjects
            state.subjects = state.subjects.map(sub => ({
                ...sub,
                notes: globalNotesMap[sub.id] || sub.notes || []
            }));
        }

        // Save notes globally
        async function saveNotesState() {
            const notesMap = {};
            state.subjects.forEach(sub => {
                if (sub.notes && sub.notes.length > 0) {
                    notesMap[sub.id] = sub.notes;
                }
            });
            localStorage.setItem('gate_global_notes', JSON.stringify(notesMap));

            // Sync Admin Notes to Supabase Admin_Operator account
            if (supabase && state.isAdmin) {
                try {
                    await supabase
                        .from('gate_accounts')
                        .update({ subjects: state.subjects })
                        .ilike('username', ADMIN_USERNAME);
                } catch (err) {
                    console.error("Error syncing admin notes to cloud:", err);
                }
            }
        }

        // --- AUTH & DATA LOGIC ---

        window.toggleAuthMode = function() {
            state.authMode = state.authMode === 'login' ? 'register' : 'login';
            state.authError = '';
            render();
        }

        window.submitAuth = async function(e) {
            e.preventDefault();
            
            if (!supabase) {
                state.authError = "Database not connected. Check Supabase keys.";
                render();
                return;
            }

            const usernameInput = document.getElementById('auth-username').value.trim();
            const pinInput = document.getElementById('auth-pin').value;

            if (!usernameInput || !usernameInput.match(/^[a-zA-Z0-9_]{3,20}$/)) {
                state.authError = "Username: 3-20 chars, letters, numbers, and underscores only.";
                render(); return;
            }
            if (!pinInput || !pinInput.match(/^[0-9]{6}$/)) {
                state.authError = "PIN must be exactly 6 digits.";
                render(); return;
            }

            let nameInput = '';
            let cityInput = '';

            if (state.authMode === 'register') {
                nameInput = document.getElementById('auth-name').value.trim();
                cityInput = document.getElementById('auth-city').value.trim();
                const confirmPinInput = document.getElementById('auth-confirm-pin').value;

                if (!nameInput || !cityInput) {
                    state.authError = "Name and City are required for registration.";
                    render(); return;
                }
                if (pinInput !== confirmPinInput) {
                    state.authError = "PINs do not match. Verify and try again.";
                    render(); return;
                }
            }

            state.view = 'loading';
            render();

            try {
                if (state.authMode === 'register') {
                    // Check if user exists (case-insensitive)
                    const { data: existingUser, error: checkError } = await supabase
                        .from('gate_accounts')
                        .select('username')
                        .ilike('username', usernameInput)
                        .maybeSingle();

                    if (checkError) throw checkError;

                    if (existingUser) {
                        state.authError = "Username is already claimed by another operative.";
                        state.view = 'auth';
                    } else {
                        // Create new profile
                        const { error: insertError } = await supabase
                            .from('gate_accounts')
                            .insert([{ 
                                username: usernameInput,
                                pin: pinInput, 
                                name: nameInput,
                                city: cityInput,
                                subjects: INITIAL_SUBJECTS 
                            }]);
                            
                        if (insertError) throw insertError;

                        state.customUser = { username: usernameInput, name: nameInput, city: cityInput };
                        state.isAdmin = (usernameInput.toLowerCase() === ADMIN_USERNAME.toLowerCase());
                        state.subjects = JSON.parse(JSON.stringify(INITIAL_SUBJECTS)); 
                        loadLocalSettings(usernameInput); 
                        await loadGlobalNotes();
                        state.view = 'app';
                    }
                } else { 
                    // Login (case-insensitive)
                    const { data, error } = await supabase
                        .from('gate_accounts')
                        .select('*')
                        .ilike('username', usernameInput)
                        .maybeSingle();

                    if (error) throw error;

                    if (!data) {
                        state.authError = "Operative ID not found. If this is a new account, click 'New Operative? Register Here.' below.";
                        state.view = 'auth';
                    } else {
                        if (data.pin !== pinInput) {
                            state.authError = "Access Denied: Incorrect PIN.";
                            state.view = 'auth';
                        } else {
                            state.customUser = { 
                                username: data.username, 
                                name: data.name || 'Unknown', 
                                city: data.city || 'Unknown' 
                            };
                            state.isAdmin = (data.username.toLowerCase() === ADMIN_USERNAME.toLowerCase());
                            state.subjects = data.subjects || JSON.parse(JSON.stringify(INITIAL_SUBJECTS));
                            
                            state.customTargetDate = data.custom_target_date || null;
                            if (!state.customTargetDate) {
                                loadLocalSettings(data.username);
                            }

                            await loadGlobalNotes();
                            state.view = 'app';
                        }
                    }
                }
            } catch (err) {
                console.error("Supabase error:", err);
                state.authError = "Network interface offline: " + err.message;
                state.view = 'auth';
            }
            render();
        }

        window.logout = function() {
            state.customUser = null;
            state.isAdmin = false;
            state.subjects = INITIAL_SUBJECTS; 
            state.authError = '';
            state.authMode = 'login';
            state.customTargetDate = null;
            state.activeNotesSubjectId = null;
            state.activePreviewNote = null;
            state.noteToDelete = null;
            state.view = 'auth';
            render();

        async function saveToCloud() {
            if (!supabase || !state.customUser) return;
            try {
                await supabase
                    .from('gate_accounts')
                    .update({ 
                        subjects: state.subjects,
                        custom_target_date: state.customTargetDate
                    })
                    .eq('username', state.customUser.username);

                console.error("Save error", e);
            }
        }

        function loadLocalSettings(username) {
            const savedDate = localStorage.getItem('gate_target_' + username);
            if (savedDate) {
                state.customTargetDate = parseInt(savedDate, 10);
            } else {
                state.customTargetDate = null;
            }
        }

        // --- INTERACTION HANDLERS ---
        window.toggleExpand = function(subjectId) {
            state.expanded[subjectId] = !state.expanded[subjectId];

        };

        window.markSubjectComplete = function(subjectId, isComplete) {
            state.subjects = state.subjects.map(sub => {
                if (sub.id !== subjectId) return sub;
                return {
                    ...sub,
                    chapters: sub.chapters.map(chap => ({
                        ...chap,
                        theory: isComplete,
                        questions: isComplete
                    }))
                };
            });
            render();
            saveToCloud();
        };

        window.toggleChapter = function(subjectId, chapterId, type) {
            state.subjects = state.subjects.map(sub => {
                if (sub.id !== subjectId) return sub;
                return {
                    ...sub,
                    chapters: sub.chapters.map(chap => {
                        if (chap.id !== chapterId) return chap;
                        return { ...chap, [type]: !chap[type] };
                    })
                };
            });

            saveToCloud();
        };

            if (!state.customUser) return;
            if (val) {
                const dateObj = val instanceof Date ? val : new Date(val);
                state.customTargetDate = dateObj.getTime();
                localStorage.setItem('gate_target_' + state.customUser.username, state.customTargetDate);
            } else {
                state.customTargetDate = null;
                localStorage.removeItem('gate_target_' + state.customUser.username);

        // File selection upload handler for Admin_Operator
        window.handleFileSelect = async function(e) {
            const file = e.target.files[0];
            if (!file) return;

            if (file.type !== 'application/pdf' && !file.name.endsWith('.pdf')) {
                alert("Only PDF files are supported.");
                return;
            }

            if (file.size > 15 * 1024 * 1024) { // 15MB limit
                alert("File size too large. Maximum allowed size is 15MB.");
                return;
            }

            const titleInput = document.getElementById('note-title-input');
            const descInput = document.getElementById('note-desc-input');
            const title = titleInput && titleInput.value.trim() ? titleInput.value.trim() : file.name;
            const description = descInput ? descInput.value.trim() : 'Uploaded PDF notes';

            state.uploadingNote = true;
            render();

            const reader = new FileReader();
            reader.onload = async function(event) {
                const base64Url = event.target.result;
                const newNote = {
                    id: 'note_' + Date.now(),
                    title: title,
                    description: description,
                    fileUrl: base64Url,
                    uploadedAt: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }),
                    size: (file.size / (1024 * 1024)).toFixed(1) + ' MB'
                };

                // Add to active subject in state
                state.subjects = state.subjects.map(sub => {
                    if (sub.id === state.activeNotesSubjectId) {
                        return {
                            ...sub,
                            notes: [newNote, ...(sub.notes || [])]
                        };
                    }
                    return sub;
                });

                // Cloud push note row if Supabase active
                if (supabase) {
                    try {
                        await supabase.from('gate_notes').insert([{
                            id: newNote.id,
                            subject_id: state.activeNotesSubjectId,
                            title: newNote.title,
                            description: newNote.description,
                            file_url: newNote.fileUrl,
                            uploaded_at: newNote.uploadedAt,
                            size: newNote.size
                        }]);
                    } catch (err) {
                        console.error("Cloud insert error:", err);
                    }
                }

                await saveNotesState();
                state.uploadingNote = false;
                render();
            };

            reader.onerror = function() {
                alert("Failed to read file.");
                state.uploadingNote = false;
                render();
            };

            reader.readAsDataURL(file);
        }

            state.subjects = state.subjects.map(sub => {
                if (sub.id === state.activeNotesSubjectId) {
                    return {

                        notes: (sub.notes || []).filter(n => n.id !== noteId)
                    };

            if (supabase) {
                try {
                    await supabase
                        .from('gate_notes')
                        .delete()

        function setupEventListeners() {
            document.getElementById('app').addEventListener('click', (e) => {
                const markBtn = e.target.closest('[data-action="markComplete"]');
                if (markBtn) {
                    const subjectId = markBtn.getAttribute('data-subject-id');
                    const isComplete = markBtn.getAttribute('data-is-complete') === 'true';
                    window.markSubjectComplete(subjectId, !isComplete);

                if (expandBtn) {
                    const subjectId = expandBtn.getAttribute('data-subject-id');
                    window.toggleExpand(subjectId);

                const chapterToggle = e.target.closest('[data-action="toggleChapter"]');
                if (chapterToggle) {

                    const chapterId = chapterToggle.getAttribute('data-chapter-id');

                    window.toggleChapter(subjectId, chapterId, type);

                    return;
                }
            });

        // --- CALCULATIONS ---
        function calculateSubjectProgress(chapters) {
            if (chapters.length === 0) return 0;
            const total = chapters.length * 2;
            const completed = chapters.reduce((acc, curr) => acc + (curr.theory ? 1 : 0) + (curr.questions ? 1 : 0), 0);
            return Math.round((completed / total) * 100);
        }

        function getOverallStats() {
            let tTasks = 0;
            let cTasks = 0;
            state.subjects.forEach(sub => {
                tTasks += sub.chapters.length * 2;
                cTasks += sub.chapters.reduce((acc, curr) => acc + (curr.theory ? 1 : 0) + (curr.questions ? 1 : 0), 0);
            });
            return {
                overallProgress: tTasks === 0 ? 0 : Math.round((cTasks / tTasks) * 100),
                totalTasks: tTasks,
                completedTasks: cTasks
            };
        }

        function getAnalyticsStats() {
            let incompleteCount = 0;
            let totalChaptersCount = 0;
            
            state.subjects.forEach(sub => {
                sub.chapters.forEach(chap => {
                    totalChaptersCount++;
                    if (!(chap.theory && chap.questions)) {
                        incompleteCount++;
                    }
                });
            });

            const now = Date.now();
            const daysToGate = Math.max((GATE_DATE - now) / (1000 * 60 * 60 * 24), 0.001);
            const originalPace = (incompleteCount / daysToGate).toFixed(2);

            let revisedPace = null;
            if (state.customTargetDate) {
                const daysToCustom = Math.max((state.customTargetDate - now) / (1000 * 60 * 60 * 24), 0.001);
                revisedPace = (incompleteCount / daysToCustom).toFixed(2);
            }

            return {
                incompleteChapters: incompleteCount,
                totalChapters: totalChaptersCount,
                originalPace,
                revisedPace
            };
        }

        function formatForDateTimeLocal(timestamp) {
            const d = new Date(timestamp);
            const pad = (n) => n.toString().padStart(2, '0');
            return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
        }

                            ${state.customTargetDate ? `
                                <div class="bg-slate-900/80 backdrop-blur-md border border-fuchsia-900/50 rounded-xl p-4 flex flex-col items-center shadow-[0_0_20px_rgba(217,70,239,0.1)]">
                                    <div class="flex items-center gap-2 text-fuchsia-500 mb-2">
                                        ${icons.clock}
                                        <span class="text-[10px] sm:text-xs uppercase tracking-[0.2em] font-bold text-center">REVISED TARGET IN</span>
                                    </div>
                                    <div class="flex gap-2 sm:gap-4 font-mono">
                                        ${renderTimerBox('rev-cd-day', state.revisedCountdown.d.toString().padStart(2, '0'), 'DAY', 'text-fuchsia-300')}
                                        ${renderTimerBox('rev-cd-hrs', state.revisedCountdown.h.toString().padStart(2, '0'), 'HRS', 'text-fuchsia-300')}
                                        ${renderTimerBox('rev-cd-min', state.revisedCountdown.m.toString().padStart(2, '0'), 'MIN', 'text-fuchsia-300')}
                                        ${renderTimerBox('rev-cd-sec', state.revisedCountdown.s.toString().padStart(2, '0'), 'SEC', 'text-fuchsia-300')}
                                    </div>
                                </div>
                            ` : ''}
                        </div>
                    </header>

                    <!-- OVERALL PROGRESS -->
                    <section class="mb-6 bg-slate-900/60 backdrop-blur-lg border border-slate-800 rounded-2xl p-6 relative overflow-hidden group">
                        <div class="absolute top-0 left-0 w-1 h-full bg-gradient-to-b from-cyan-500 to-emerald-500"></div>
                        
                        <div class="flex justify-between items-end mb-4">
                            <div>
                                <h2 class="text-lg uppercase tracking-widest text-slate-300 flex items-center gap-2 mb-1">
                                    ${icons.target} PREPARATION STATUS
                                </h2>
                                <p class="text-slate-500 text-sm font-mono">${stats.completedTasks} / ${stats.totalTasks} Targets Eliminated</p>
                            </div>
                            <div class="text-right">
                                <span class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-br from-white to-slate-500">
                                    ${stats.overallProgress}%
                                </span>
                            </div>
                        </div>
                        
                        ${renderProgressBar(stats.overallProgress, "h-3", overallColorClass, overallGlowClass)}
                    </section>

                    <!-- NEURAL ANALYTICS -->
                    <section class="mb-10 bg-slate-900/60 backdrop-blur-lg border border-slate-800 rounded-2xl p-6 relative overflow-hidden">
                        <div class="absolute top-0 left-0 w-1 h-full bg-gradient-to-b from-amber-500 to-fuchsia-500"></div>
                        <h2 class="text-lg uppercase tracking-widest text-slate-300 flex items-center gap-2 mb-6">
                            ${icons.activity} NEURAL ANALYTICS
                        </h2>
                        
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                            
                            <!-- Left: Incomplete chapters -->
                            <div class="bg-slate-950/50 border border-slate-800 p-4 rounded-xl flex flex-col justify-center">
                                <span class="text-xs text-slate-500 font-mono tracking-widest uppercase mb-2">Incomplete Chapters</span>
                                <div class="flex items-end gap-2">
                                    <span class="text-4xl font-black text-slate-200">${analytics.incompleteChapters}</span>
                                    <span class="text-sm text-slate-500 mb-1">/ ${analytics.totalChapters}</span>
                                </div>
                                <span class="text-[10px] text-amber-500/80 mt-1">*Theory AND PYQ required for completion</span>
                            </div>

                            <!-- Middle: Custom Target Setter -->
                            <div class="bg-slate-950/50 border border-slate-800 p-4 rounded-xl">
                                <span class="text-xs text-slate-500 font-mono tracking-widest uppercase mb-2 block">Revise Timeframe</span>
                                <input type="text" 
                                       id="custom-target-date-picker"
                                       placeholder="Select Target Date..."
                                       class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-200 text-sm font-mono focus:outline-none focus:border-fuchsia-500 focus:ring-1 focus:ring-fuchsia-500 transition-all mb-3 cursor-pointer text-center">
                                
                                ${state.customTargetDate ? `
                                    <button onclick="clearCustomTargetDate()" class="text-xs w-full text-center text-slate-400 hover:text-fuchsia-400 border border-slate-700 hover:border-fuchsia-500/50 rounded py-1.5 transition-colors font-mono">
                                        Revert to Original Date
                                    </button>
                                ` : `
                                    <div class="text-[10px] text-slate-500 text-center font-mono py-1.5">No custom timeframe active.</div>
                                `}
                            </div>

                            <!-- Right: Required Pace -->
                            <div class="bg-slate-950/50 border border-slate-800 p-4 rounded-xl flex flex-col justify-center relative overflow-hidden">
                                <span class="text-xs text-slate-500 font-mono tracking-widest uppercase mb-2 relative z-10">Required Pace</span>
                                
                                <div class="flex flex-col gap-2 relative z-10">
                                    <div class="flex justify-between items-end border-b border-slate-800 pb-2">
                                        <span class="text-sm text-slate-400">To Feb '27:</span>
                                        <span class="font-mono text-cyan-400 text-lg font-bold">${analytics.originalPace} <span class="text-[10px] text-slate-500">CH/DAY</span></span>
                                    </div>
                                    
                                    ${state.customTargetDate ? `
                                        <div class="flex justify-between items-end">
                                            <span class="text-sm text-slate-400">To Revised:</span>
                                            <span class="font-mono text-fuchsia-400 text-lg font-bold">${analytics.revisedPace} <span class="text-[10px] text-slate-500">CH/DAY</span></span>
                                        </div>
                                    ` : `
                                        <div class="flex justify-between items-end opacity-30">
                                            <span class="text-sm text-slate-400">To Revised:</span>
                                            <span class="font-mono text-fuchsia-400 text-lg font-bold">-- <span class="text-[10px] text-slate-500">CH/DAY</span></span>
                                        </div>
                                    `}
                                </div>
                            </div>
                        </div>
                    </section>

                    <!-- SUBJECTS LIST -->
                    <div class="space-y-4 pb-20">
                        ${subjectsHTML}
                    </div>

                    <!-- Watermark / Footer -->
                    <div class="mt-12 pb-20 text-center">
                        <div class="inline-block bg-slate-900/60 backdrop-blur-md border border-slate-800/80 rounded-full px-4 py-2 text-[10px] md:text-xs font-mono text-slate-400 hover:border-cyan-800 hover:text-slate-300 transition-all duration-300">
                            MADE BY <span class="text-cyan-500 font-bold uppercase tracking-wider">Shikhar Verma</span>
                            <span class="mx-2 text-slate-600">//</span>
                            SUPPORT & SUGGESTIONS:
                            <a href="mailto:shikharverma1254@gmail.com"
                               class="text-fuchsia-400 hover:text-fuchsia-300 hover:underline transition-colors">
                                shikharverma1254@gmail.com
                            </a>
                        </div>
                    </div>
                </div>

                <!-- MODALS -->
                ${renderNotesModal()}
                ${renderPreviewModal()}
                ${renderDeleteConfirmModal()}
            `;
            
            // Re-bind DOM references for the ticker
            updateCountdownDOM();

            // Initialize Flatpickr for the date selector
            const datePickerEl = document.getElementById('custom-target-date-picker');
            if (datePickerEl) {
                flatpickr(datePickerEl, {
                    enableTime: true,
                    dateFormat: "Y-m-d H:i",
                    defaultDate: state.customTargetDate ? new Date(state.customTargetDate) : null,
                    onReady: function(selectedDates, dateStr, instance) {
                        const btnContainer = document.createElement("div");
                        btnContainer.className = "cyber-confirm-btn-container";
                        
                        const confirmBtn = document.createElement("button");
                        confirmBtn.className = "cyber-confirm-btn";
                        confirmBtn.innerHTML = "Confirm Timeframe";
                        confirmBtn.type = "button";
                        
                        confirmBtn.addEventListener("click", function() {
                            if (instance.selectedDates.length > 0) {
                                const newTime = instance.selectedDates[0].getTime();
                                if (newTime !== state.customTargetDate) {
                                    window.updateCustomTargetDate(instance.selectedDates[0]);
                                }
                            }
                            instance.close();
                        });
                        
                        btnContainer.appendChild(confirmBtn);
                        instance.calendarContainer.appendChild(btnContainer);
                    },
                    onClose: function(selectedDates, dateStr, instance) {
                        if (state.customTargetDate) {
                            instance.setDate(new Date(state.customTargetDate), false);
                        } else {
                            instance.clear(false);
                        }
                    }
                });
            }
        }

        // Boot
        init();

    </script>
</body>
</html>
